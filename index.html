<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TO & Clay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ========== HEADER ========== -->
  <header>
    <div class="logo" id="store-title">TO & CLAY</div>

    <!-- Mobile menu button -->
    <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="main-nav" id="main-nav">
      <a href="#products" onclick="scrollToProducts(); closeMobileMenu()">Shop</a>
      <a href="#story" onclick="closeMobileMenu()">Our Story</a>
      <a href="#contact" onclick="closeMobileMenu()">Contact</a>
    </nav>

    <div class="header-right">
      <div class="lang-switcher">
        <button onclick="setLanguage('en')">EN</button>
        <button onclick="setLanguage('ar')">ع</button>
        <button onclick="setLanguage('fr')">FR</button>
        <button onclick="setLanguage('es')">ES</button>
      </div>

      <div class="cart-icon" onclick="toggleCart()" title="Cart">
        <span class="cart-symbol">🛒</span>
        <span id="cart-count">0</span>
      </div>
    </div>
  </header>

  <!-- ========== HERO SECTION ========== -->
  <section class="hero">
    <div class="hero-image">
      <img src="images/hero-candle.jpg" alt="TO & Clay handmade candle">
    </div>

    <div class="hero-content">
      <p class="hero-eyebrow" id="hero-eyebrow">Handmade in Morocco</p>
      <h1 class="hero-title" id="hero-title">Objects made slowly,<br>for homes lived<br>beautifully.</h1>
      <p class="hero-subtitle" id="hero-subtitle">
        Handmade ceramic home objects and scented candles with an expressive, considered touch.
      </p>
      <button class="hero-btn" onclick="scrollToProducts()" id="hero-btn">
        Explore the Collection
      </button>
    </div>
  </section>

  <!-- ========== PRODUCTS ========== -->
  <section id="products" class="products-section">
    <div class="section-header">
      <p class="section-eyebrow">The Collection</p>
      <h2 id="collection-title">For the table, the shelf, and the moments in between.</h2>
    </div>

    <div id="products-grid" class="products-grid">
      <!-- Products will be added here by JavaScript -->
    </div>
  </section>

  <!-- ========== CART SIDEBAR ========== -->
  <div id="cart" class="cart hidden">
    <div class="cart-header">
      <h2 id="cart-title">Your Cart</h2>
      <button class="cart-close-mobile" onclick="toggleCart()" aria-label="Close cart">×</button>
    </div>
    <div id="cart-items"></div>
    <p class="cart-total-line">
      <span id="total-text">Total</span>: <span id="cart-total">0</span> MAD
    </p>
    <button onclick="checkout()" id="checkout-btn">Checkout with WhatsApp</button>
    <button onclick="toggleCart()" id="close-btn" class="desktop-only">Close</button>
  </div>

  <!-- ========== LIGHTBOX ========== -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">×</button>
    <button class="lightbox-arrow lightbox-prev" onclick="changeLightboxImage(-1)">‹</button>
    <button class="lightbox-arrow lightbox-next" onclick="changeLightboxImage(1)">›</button>
    <img src="" alt="Product image" id="lightbox-img">
  </div>

  <script src="script.js"></script>
</body>
</html>
